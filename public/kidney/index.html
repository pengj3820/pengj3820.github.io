const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));

/* narration timing (timing.js): stretch each scene so every line finishes before the next one starts */
const TIMING=window.KIDNEY_TIMING||null;
scenes.forEach((s,i)=>{s.dStarts=s.subs.map(x=>x[0]);s.dDur=s.dur;const tm=TIMING&&TIMING[i];
  s.rStarts=tm?tm.starts:s.dStarts.slice();if(tm)s.dur=tm.dur;});
function toDesign(s,t){const A=[0,...s.rStarts,s.dur],D=[0,...s.dStarts,s.dDur];
  for(let k=0;k<A.length-1;k++)if(t<=A[k+1]){const span=A[k+1]-A[k];return span>0?lerp(D[k],D[k+1],(t-A[k])/span):D[k+1];}
  return s.dDur;}
let acc=0;scenes.forEach(s=>{s.start=acc;acc+=s.dur;});
const TOTAL=acc;

function subtitleAt(si,t){const st=scenes[si].rStarts;let k=-1;for(let i=0;i<st.length;i++)if(t>=st[i])k=i;return k;}
function drawSub(s){if(!s)return;ctx.font=`bold 34px ${FONT}`;const w=ctx.measureText(s).width+64;rr(640-w/2,628,w,64,18);ctx.fillStyle='rgba(20,20,30,.72)';ctx.fill();text(s,640,661,34,'#fff');}
function drawTag(i){const s=scenes[i].title;ctx.font=`bold 24px ${FONT}`;const w=ctx.measureText(s).width+78;
  rr(22,20,w,46,23);ctx.fillStyle='rgba(255,255,255,.88)';ctx.fill();ctx.beginPath();ctx.arc(45,43,16,0,PI*2);ctx.fillStyle='#d9534f';ctx.fill();
  text(String(i+1),45,44,18,'#fff');text(s,70,44,24,'#333','left');}
function locate(T){T=clamp(T,0,TOTAL-1e-3);let i=0;while(i<scenes.length-1&&T>=scenes[i].start+scenes[i].dur)i++;return[i,T-scenes[i].start];}
function renderAt(T){const[i,t]=locate(T),s=scenes[i];ctx.save();ctx.clearRect(0,0,W,H);s.draw(toDesign(s,t));ctx.restore();
  ctx.save();if(i>0)drawTag(i);const k=subtitleAt(i,t);if(k>=0)drawSub(s.subs[k][1]);ctx.restore();
  const f=Math.max(1-t/.4,(t-(s.dur-.4))/.4,0);if(f>0){ctx.fillStyle=`rgba(255,255,255,${f})`;ctx.fillRect(0,0,W,H);}
}

/* ---------- script panel ---------- */
const sc=document.getElementById('script');
scenes.forEach((s,i)=>{const h=document.createElement('h3');h.textContent=`${i+1}. ${s.title}`;sc.appendChild(h);
  s.subs.forEach(([,l])=>{const p=document.createElement('p');p.textContent=l;sc.appendChild(p);});});

if(new URLSearchParams(location.search).has('record')){document.body.classList.add('record');window.renderAt=renderAt;window.TOTAL=TOTAL;window.SCRIPT=scenes.map(s=>({starts:s.dStarts,dur:s.dDur,lines:s.subs.map(x=>x[1])}));renderAt(0);return;}

/* ---------- player ---------- */
const play=document.getElementById('play'),seek=document.getElementById('seek'),time=document.getElementById('time'),chap=document.getElementById('chap'),mute=document.getElementById('mute'),nar=document.getElementById('nar');
scenes.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s.title}`;chap.appendChild(o);});
let cur=0,playing=false,last=performance.now(),seeking=false,audioOK=false;
nar.addEventListener('canplay',()=>{audioOK=true;});nar.addEventListener('error',()=>{audioOK=false;mute.style.display='none';});
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function jump(t){cur=clamp(t,0,TOTAL);try{nar.currentTime=cur;}catch(e){}}
function setPlaying(p){playing=p;if(p&&cur>=TOTAL-.01)jump(0);play.textContent=p?'❚❚ 暂停':'▶ 播放';
  if(p){jump(cur);nar.play().catch(()=>{});}else nar.pause();}
function tick(now){if(playing){if(audioOK&&!nar.paused&&!nar.ended)cur=nar.currentTime;else cur+=(now-last)/1000;
    if(cur>=TOTAL){cur=TOTAL;setPlaying(false);}}last=now;
  renderAt(cur);
  if(!seeking)seek.value=Math.round(cur/TOTAL*1000);time.textContent=fmt(cur)+' / '+fmt(TOTAL);
  const ci=locate(cur)[0];if(chap.value!=ci)chap.value=ci;requestAnimationFrame(tick);}
seek.addEventListener('input',()=>{seeking=true;jump(seek.value/1000*TOTAL);});
seek.addEventListener('change',()=>{seeking=false;});
chap.addEventListener('change',()=>jump(scenes[+chap.value].start));
mute.addEventListener('click',()=>{nar.muted=!nar.muted;mute.textContent=nar.muted?'🔇 声音关':'🔊 声音开';});
play.addEventListener('click',()=>setPlaying(!playing));cv.addEventListener('click',()=>setPlaying(!playing));
document.getElementById('fs').addEventListener('click',()=>{const el=document.querySelector('.player');(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?.())});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'&&e.target.tagName!=='SELECT'){e.preventDefault();setPlaying(!playing);}});
requestAnimationFrame(tick);
})();
